    />

  </head>
  <body>

      <div class="l-header__inner l-container">

              >
            </li>

            </li>

        </button>
      </div>

    <main class="l-main" id="main">
      <div class="p-sub">
        <div class="l-container p-sub-container">
          <nav class="p-sub-breadcrumb" aria-label="パンくず">
            <ol>
              <li><a href="./index.html">トップページ</a></li>
              <li aria-current="page">お問い合わせ</li>
            </ol>
          </nav>
          <div class="p-sub-heading">
            <p>Contact</p>
            <h1>お問い合わせ</h1>
          </div>
          <div class="p-sub-narrow">
            <p class="p-sub-copy">
              工事に関するご相談や、採用についてのお問い合わせの入力画面です。
            </p>
            <ol class="p-sub-stepper" aria-label="お問い合わせの手順">
              <li aria-current="step"><span>STEP 01</span>入力</li>
              <li><span>STEP 02</span>確認</li>
              <li><span>STEP 03</span>デモ完了</li>
            </ol>
            <form class="p-sub-form" data-contact-form novalidate>
              <div
                class="p-sub-error-summary"
                role="alert"
                tabindex="-1"
                data-error-summary
                hidden
              ></div>
              <div class="p-sub-field">
                <label for="type"
                  ><span>お問い合わせ種別</span
                  ><span class="p-sub-required">必須</span></label
                >
                <div>
                  <select
                    id="type"
                    name="type"
                    required
                    aria-describedby="type-error"
                  >
                    <option value="">選択してください</option>
                    <option value="business">工事・事業に関するご相談</option>
                    <option value="recruit">採用に関するご相談</option>
                    <option value="other">その他</option>
                  </select>
                  <p class="p-sub-error" id="type-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-field">
                <label for="name"
                  ><span>お名前</span
                  ><span class="p-sub-required">必須</span></label
                >
                <div>
                  <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="off"
                    maxlength="80"
                    required
                    aria-describedby="name-error"
                    placeholder="例：テスト 太郎"
                  />
                  <p class="p-sub-error" id="name-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-field">
                <label for="email"
                  ><span>メールアドレス</span
                  ><span class="p-sub-required">必須</span></label
                >
                <div>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="off"
                    maxlength="254"
                    required
                    aria-describedby="email-error"
                    placeholder="例：test@example.com"
                  />
                  <p class="p-sub-error" id="email-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-field">
                <label for="company">会社名（任意）</label>
                <div>
                  <input
                    id="company"
                    name="company"
                    type="text"
                    autocomplete="off"
                    maxlength="120"
                    aria-describedby="company-error"
                  />
                  <p class="p-sub-error" id="company-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-field">
                <label for="phone">電話番号（任意）</label>
                <div>
                  <input
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="off"
                    maxlength="30"
                    aria-describedby="phone-error"
                    placeholder="テスト用の番号を入力"
                  />
                  <p class="p-sub-error" id="phone-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-field">
                <label for="message"
                  ><span>お問い合わせ内容</span
                  ><span class="p-sub-required">必須</span></label
                >
                <div>
                  <textarea
                    id="message"
                    name="message"
                    rows="7"
                    maxlength="3000"
                    required
                    aria-describedby="message-error"
                    placeholder="ご相談内容を入力してください（3,000文字以内）"
                  ></textarea>
                  <p class="p-sub-error" id="message-error" hidden></p>
                </div>
              </div>
              <div class="p-sub-consent">
                <input
                  id="consent"
                  name="consent"
                  type="checkbox"
                  required
                  aria-describedby="consent-error"
                /><label for="consent"
                  ><a href="./privacy.html" target="_blank" rel="noopener"
                    >プライバシーポリシー</a
                  >と、入力内容が送信されないデモであることを確認しました。</label
                >
              </div>
              <p class="p-sub-error" id="consent-error" hidden></p>
              <div class="p-sub-actions">
                <button
                  class="p-sub-btn c-action-button"
                  type="submit"
                  disabled
                >
                  <span class="c-action-button__label">入力内容を確認する</span
                  ><span class="c-action-button__icon" aria-hidden="true"
                    >→</span
                  >
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

            <p class="l-footer__copyright">
              <small>© 2026 蒼建株式会社</small>
            </p>
          </div>
          <a
            class="l-footer__page-top"
            href="#main"
            aria-label="ページ上部へ戻る"

          >
        </div>
        <p class="p-sub-footer-links">
          <a href="./news.html">お知らせ</a

      </div>
    </footer>
